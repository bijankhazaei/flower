services:
  # Main FastAPI application
  flower:
    build: .
    ports:
      - "8022:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://flower:flower@db:5432/flower
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://flower:flower@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - flower-network
    restart: unless-stopped

  # Frontend React application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3022:3000"
    environment:
      - VITE_API_URL=http://localhost:8022
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    depends_on:
      - flower
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - flower-network
    restart: unless-stopped

  # PostgreSQL database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=flower
      - POSTGRES_USER=flower
      - POSTGRES_PASSWORD=flower
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flower -d flower"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flower-network
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - "6322:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flower-network
    restart: unless-stopped

  # RabbitMQ message broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=flower
      - RABBITMQ_DEFAULT_PASS=flower
    ports:
      - "5622:5672"
      - "15622:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - flower-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  flower-network:
    driver: bridge