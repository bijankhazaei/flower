services:
  flower:
    build:
      context: .
      target: builder
    volumes:
      - .:/app
      - /app/__pycache__
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql+asyncpg://flower:flower@db:5432/flower
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - flower-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=flower
      - POSTGRES_USER=flower
      - POSTGRES_PASSWORD=flower
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - flower-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flower-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=flower
      - RABBITMQ_DEFAULT_PASS=flower
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - flower-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  flower-network:
    driver: bridge